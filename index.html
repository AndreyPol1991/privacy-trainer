<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Персональные данные и доступы — тренажёр аналитика</title>
<meta name="description" content="Сервис записи к врачу разбирается по частям: какие данные персональные, на каком основании их собирают, кто что видит, где лежат секреты и что писать в аудит." />
<style>
  /*
    Один файл без сборки — как у остальных тренажёров. Всё, что нужно для
    работы, лежит здесь: разметка, стили, задания и мост к платформе.
  */
  :root {
    color-scheme: dark;
    --bg: #0b1120;
    --surface: #131c2f;
    --surface-2: #1b263f;
    --line: #2a3a5a;
    --text: #e8eefc;
    --muted: #9fb0d0;
    --accent: #22d3ee;
    --accent-ink: #062c34;
    --ok: #34d399;
    --bad: #fb7185;
    --warn: #fbbf24;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif;
  }

  /* Фокус виден всегда: тренажёр проходится с клавиатуры целиком. */
  :focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 64px; }

  header.top {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  header.top h1 { font-size: 17px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
  .spacer { flex: 1 1 auto; }

  .badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--muted);
    white-space: nowrap;
  }
  .badge--live { border-color: var(--accent); color: var(--accent); }

  .bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 12px; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }

  main { display: grid; grid-template-columns: 260px 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  nav.list {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px;
    align-self: start;
  }
  nav.list h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 8px 6px; }
  nav.list button {
    display: flex;
    gap: 8px;
    align-items: center;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    color: var(--text);
    padding: 8px;
    border-radius: 10px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    min-height: 40px;
  }
  nav.list button:hover { background: var(--surface-2); }
  nav.list button[aria-current='true'] { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--accent); }
  nav.list .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line); flex: 0 0 auto; }
  nav.list .dot.done { background: var(--ok); border-color: var(--ok); }

  section.card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
  }

  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  h2.title { font-size: 20px; margin: 6px 0 10px; }
  .story { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .prompt { margin: 0 0 14px; }

  ul.opts { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 8px; }
  ul.opts button {
    width: 100%;
    text-align: left;
    background: var(--surface-2);
    border: 1.5px solid var(--line);
    color: var(--text);
    border-radius: 12px;
    padding: 12px 14px;
    font: inherit;
    cursor: pointer;
    min-height: 44px;
  }
  ul.opts button[aria-pressed='true'] { border-color: var(--accent); background: #16324a; }
  ul.opts button.right { border-color: var(--ok); }
  ul.opts button.wrong { border-color: var(--bad); }
  ul.opts .mark { float: right; margin-left: 12px; font-weight: 700; }

  table.grid { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 14px; }
  table.grid th, table.grid td { border: 1px solid var(--line); padding: 8px; text-align: left; }
  table.grid th { color: var(--muted); font-weight: 600; }
  table.grid td { text-align: center; }
  table.grid button {
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    font: inherit;
  }
  table.grid button[aria-pressed='true'] { border-color: var(--accent); background: #16324a; }
  table.grid button.right { border-color: var(--ok); }
  table.grid button.wrong { border-color: var(--bad); }

  .match { display: grid; gap: 8px; margin-bottom: 16px; }
  .match .pair { display: grid; grid-template-columns: 1fr 220px; gap: 8px; align-items: center; }
  @media (max-width: 640px) { .match .pair { grid-template-columns: 1fr; } }
  .match .left { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .match select {
    width: 100%;
    background: var(--surface-2);
    color: var(--text);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    font: inherit;
    min-height: 44px;
  }
  .match select.right { border-color: var(--ok); }
  .match select.wrong { border-color: var(--bad); }

  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  button.btn {
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    border-radius: 12px;
    padding: 11px 18px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    min-height: 44px;
  }
  button.btn[disabled] { opacity: .5; cursor: not-allowed; }
  button.ghost { background: none; color: var(--text); border: 1.5px solid var(--line); }

  .note { border-radius: 12px; padding: 12px 14px; font-size: 14px; margin: 14px 0 0; border: 1px solid var(--line); }
  .note--ok { border-color: var(--ok); background: #0e2a22; }
  .note--bad { border-color: var(--bad); background: #2c1420; }
  .note--hint { border-color: var(--warn); background: #2a2212; }

  .meta { color: var(--muted); font-size: 13px; }
  footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Персональные данные и доступы</h1>
      <p class="sub">Сервис записи к врачу «Тонус» — разбираем по частям</p>
    </div>
    <div class="spacer"></div>
    <span class="badge" id="score">решено 0 из 13</span>
    <span class="badge" id="link" hidden>задания идут в профиль навыков</span>
  </header>

  <div class="bar"><i id="progress"></i></div>

  <main>
    <nav class="list" aria-label="Задания">
      <h2>Задания</h2>
      <div id="menu"></div>
    </nav>

    <section class="card" id="task" aria-live="polite"></section>
  </main>

  <footer>
    <p>
      Сценарий вымышленный, персонажи тоже. Правовые формулировки упрощены до сути:
      тренажёр учит задавать правильные вопросы, а не заменяет юриста.
    </p>
  </footer>
</div>

<script>
/*
  Мост к платформе.

  Тренажёр живёт на своём домене и общается с платформой сообщениями. Наружу
  уходит только факт: «решено задание X, с такой-то попытки, с таким-то числом
  подсказок». Что это задание подтверждает в графе навыков, решает платформа —
  иначе привязка к модели оценки жила бы в чужом репозитории.

  Первое сообщение уходит всем («*»): адрес платформы тренажёру неизвестен, он
  меняется от стенда к стенду. Дальше запоминается источник ответа, и всё
  остальное шлётся уже точно ему. В сообщениях нет ничего, кроме кодов заданий.

  Без платформы всё работает ровно так же — просто некому отчитываться.
*/
const PROTOCOL = 'trainer/1';
const TRAINER = 'privacy';

const bridge = {
  embedded: window.parent !== window,
  target: '*',
  connected: false,
  send(message) {
    if (!this.embedded) return;
    window.parent.postMessage({ protocol: PROTOCOL, trainer: TRAINER, ...message }, this.target);
  },
  solved(task, attempts, hints) {
    this.send({ kind: 'solved', task, attempts, hints });
  },
};

window.addEventListener('message', (event) => {
  const data = event.data;
  if (typeof data !== 'object' || data === null || data.protocol !== PROTOCOL) return;

  if (data.kind === 'hello') {
    bridge.target = event.origin;
    bridge.connected = true;
    document.getElementById('link').hidden = false;

    // Платформа помнит зачтённое дольше, чем хранилище этого домена: оно
    // живёт на чужом сайте и очищается вместе с ним.
    for (const id of Array.isArray(data.solved) ? data.solved : []) {
      const state = progressOf(id);
      state.done = true;
      save();
    }
    render();
  }

  if (data.kind === 'accepted') {
    const state = progressOf(data.task);
    state.accepted = true;
    save();
    render();
  }
});

/* ── Задания ──────────────────────────────────────────────────────────── */

/* ── Состояние ───────────────────────────────────────────────────────── */

const STORAGE = 'privacy-trainer.v1';
let state = load();
let current = TASKS.findIndex((task) => !progressOf(task.id).done);
if (current < 0) current = 0;
let picked = new Set();
let grid = new Set();
let matched = {};
let checked = null;

function load() {
  try {
    const raw = localStorage.getItem(STORAGE);
    return raw === null ? {} : JSON.parse(raw);
  } catch {
    return {};
  }
}

function save() {
  try {
    localStorage.setItem(STORAGE, JSON.stringify(state));
  } catch {
    /* приватный режим — просто не сохраняем */
  }
}

function progressOf(id) {
  if (state[id] === undefined) state[id] = { attempts: 0, hints: 0, done: false, accepted: false };
  return state[id];
}

/* ── Проверка ответа ─────────────────────────────────────────────────── */

function isRight(task) {
  if (task.kind === 'single' || task.kind === 'multi') {
    const right = new Set(task.options.map((o, i) => (o.right ? i : -1)).filter((i) => i >= 0));
    if (picked.size !== right.size) return false;
    for (const index of picked) if (!right.has(index)) return false;
    return true;
  }

  if (task.kind === 'match') {
    return task.pairs.every((pair, index) => matched[index] === pair.right);
  }

  if (task.kind === 'grid') {
    for (let row = 0; row < task.rows.length; row += 1) {
      for (let col = 0; col < task.cols.length; col += 1) {
        const should = task.right[row][col];
        const has = grid.has(`${row}:${col}`);
        if (should !== has) return false;
      }
    }
    return true;
  }

  return false;
}

function check() {
  const task = TASKS[current];
  const progress = progressOf(task.id);
  const ok = isRight(task);

  progress.attempts += 1;
  checked = ok ? 'ok' : 'bad';

  if (ok && !progress.done) {
    progress.done = true;
    // Попытки и подсказки уходят как есть: платформа сама решит, насколько
    // это снижает вес доказательства.
    bridge.solved(task.id, Math.min(progress.attempts, 99), progress.hints);
  }

  save();
  render();
}

function openHint() {
  const task = TASKS[current];
  const progress = progressOf(task.id);
  if (progress.hints >= task.hints.length) return;
  progress.hints += 1;
  save();
  render();
}

function go(index) {
  current = index;
  picked = new Set();
  grid = new Set();
  matched = {};
  checked = null;
  render();
}

/* ── Отрисовка ───────────────────────────────────────────────────────── */

function element(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else if (value !== null && value !== false) node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children) node.append(child);
  return node;
}

/*
  Отрисовка перебирает разметку целиком, и после каждого нажатия фокус уезжал
  в начало документа: человеку с клавиатуры приходилось добираться до списка
  заново после каждой отметки. Поэтому у каждого элемента управления есть ключ,
  по которому фокус возвращается на место.
*/
function focusKey() {
  const active = document.activeElement;
  return active === null ? null : active.getAttribute('data-focus');
}

function restoreFocus(key) {
  if (key === null) return;
  const back = document.querySelector(`[data-focus="${key}"]`);
  if (back !== null) back.focus();
}

function renderMenu() {
  const menu = document.getElementById('menu');
  menu.replaceChildren();

  let group = null;
  TASKS.forEach((task, index) => {
    if (task.group !== group) {
      group = task.group;
      menu.append(element('h2', { text: group }));
    }

    const done = progressOf(task.id).done;
    menu.append(
      element(
        'button',
        {
          type: 'button',
          'data-focus': `menu:${index}`,
          'aria-current': index === current ? 'true' : 'false',
          onclick: () => go(index),
        },
        [
          element('span', { class: done ? 'dot done' : 'dot', 'aria-hidden': true }),
          element('span', { text: task.title }),
        ],
      ),
    );
  });
}

function renderOptions(task) {
  const list = element('ul', { class: 'opts' });

  task.options.forEach((option, index) => {
    const selected = picked.has(index);
    let extra = '';
    let mark = '';

    if (checked !== null) {
      if (option.right) {
        extra = ' right';
        mark = selected ? '✓' : '· верно';
      } else if (selected) {
        extra = ' wrong';
        mark = '✕';
      }
    }

    const button = element('button', {
      type: 'button',
      class: `opt${extra}`,
      'data-focus': `opt:${index}`,
      'aria-pressed': selected ? 'true' : 'false',
      onclick: () => {
        if (task.kind === 'single') picked = selected ? new Set() : new Set([index]);
        else if (selected) picked.delete(index);
        else picked.add(index);
        checked = null;
        render();
      },
    });

    button.append(element('span', { text: option.text }));
    if (mark !== '') button.append(element('span', { class: 'mark', text: mark }));

    list.append(element('li', {}, [button]));
  });

  return list;
}

function renderMatch(task) {
  const box = element('div', { class: 'match' });

  task.pairs.forEach((pair, index) => {
    const select = element('select', {
      'aria-label': pair.left,
      'data-focus': `match:${index}`,
      onchange: (event) => {
        matched[index] = event.target.value;
        checked = null;
        render();
      },
    });

    select.append(element('option', { value: '', text: '— выберите —' }));
    for (const choice of task.choices) {
      select.append(element('option', { value: choice, text: choice, ...(matched[index] === choice ? { selected: true } : {}) }));
    }

    if (checked !== null) select.className = matched[index] === pair.right ? 'right' : 'wrong';

    box.append(
      element('div', { class: 'pair' }, [element('div', { class: 'left', text: pair.left }), select]),
    );
  });

  return box;
}

function renderGrid(task) {
  const table = element('table', { class: 'grid' });
  const head = element('tr', {}, [element('th', { text: 'Роль' })]);
  for (const col of task.cols) head.append(element('th', { text: col }));
  table.append(head);

  task.rows.forEach((row, rowIndex) => {
    const tr = element('tr', {}, [element('th', { text: row })]);

    task.cols.forEach((col, colIndex) => {
      const key = `${rowIndex}:${colIndex}`;
      const selected = grid.has(key);
      let extra = '';

      if (checked !== null) {
        const should = task.right[rowIndex][colIndex];
        if (should === selected) extra = ' right';
        else extra = ' wrong';
      }

      const button = element('button', {
        type: 'button',
        class: extra.trim(),
        'data-focus': `grid:${key}`,
        'aria-pressed': selected ? 'true' : 'false',
        'aria-label': `${row}: ${col}`,
        text: selected ? '✓' : '',
        onclick: () => {
          if (selected) grid.delete(key);
          else grid.add(key);
          checked = null;
          render();
        },
      });

      tr.append(element('td', {}, [button]));
    });

    table.append(tr);
  });

  return table;
}

function render() {
  const task = TASKS[current];
  const progress = progressOf(task.id);
  const done = TASKS.filter((one) => progressOf(one.id).done).length;
  const keep = focusKey();

  document.getElementById('score').textContent = `решено ${done} из ${TASKS.length}`;
  document.getElementById('progress').style.width = `${(done / TASKS.length) * 100}%`;

  renderMenu();

  const card = document.getElementById('task');
  card.replaceChildren();

  card.append(element('span', { class: 'eyebrow', text: task.group }));
  card.append(element('h2', { class: 'title', text: task.title }));
  card.append(element('p', { class: 'story', text: task.story }));
  card.append(element('p', { class: 'prompt', text: task.prompt }));

  if (task.kind === 'match') card.append(renderMatch(task));
  else if (task.kind === 'grid') card.append(renderGrid(task));
  else card.append(renderOptions(task));

  for (let i = 0; i < progress.hints; i += 1) {
    card.append(element('p', { class: 'note note--hint', text: `Подсказка ${i + 1}. ${task.hints[i]}` }));
  }

  const actions = element('div', { class: 'row' });

  actions.append(
    element('button', {
      type: 'button',
      class: 'btn',
      'data-focus': 'act:check',
      text: progress.done ? 'Проверить снова' : 'Проверить',
      onclick: check,
    }),
  );

  if (progress.hints < task.hints.length) {
    actions.append(
      element('button', {
        type: 'button',
        class: 'btn ghost',
        'data-focus': 'act:hint',
        text: progress.hints === 0 ? 'Подсказка' : 'Ещё подсказка',
        onclick: openHint,
      }),
    );
  }

  if (current < TASKS.length - 1) {
    actions.append(
      element('button', {
        type: 'button',
        class: 'btn ghost',
        'data-focus': 'act:next',
        text: 'Следующее →',
        onclick: () => go(current + 1),
      }),
    );
  }

  card.append(actions);

  if (progress.attempts > 0) {
    const parts = [`попыток: ${progress.attempts}`];
    if (task.hints.length > 0) parts.push(`подсказок: ${progress.hints} из ${task.hints.length}`);
    if (progress.accepted) parts.push('зачтено в профиль навыков');
    card.append(element('p', { class: 'meta', text: parts.join(' · ') }));
  }

  if (checked === 'ok') {
    card.append(element('p', { class: 'note note--ok', text: `Верно. ${task.explain}` }));
  }

  if (checked === 'bad') {
    card.append(
      element('p', {
        class: 'note note--bad',
        text: 'Пока не сходится. Неверно отмеченное подсвечено, верное — зелёным контуром. Исправьте и проверьте снова.',
      }),
    );
  }

  restoreFocus(keep);
}

render();
bridge.send({ kind: 'ready' });
</script>
</body>
</html>
